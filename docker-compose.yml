services:
  frontend:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        - VITE_API_BASE_URL=http://localhost:5001
        - VITE_API_URL=http://localhost:5001
        - VITE_GOOGLE_CLIENT_ID=475289564338-bjoieqnbf2abi140onried6ao9getu4a.apps.googleusercontent.com
        - "VITE_CSP_POLICY=default-src * 'unsafe-inline' 'unsafe-eval' data: blob:;"
    ports:
      - "8080:80"
    environment:
      - VITE_API_BASE_URL=http://localhost:5001
      - VITE_API_URL=http://localhost:5001
      - VITE_GOOGLE_CLIENT_ID=475289564338-bjoieqnbf2abi140onried6ao9getu4a.apps.googleusercontent.com
      - "VITE_CSP_POLICY=default-src * 'unsafe-inline' 'unsafe-eval' data: blob:;"
    restart: always
