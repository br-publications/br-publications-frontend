<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta http-equiv="Content-Security-Policy" content="%VITE_CSP_POLICY%" />
  <link rel="icon" type="image/png" href="/BR_logo.png" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <!-- DNS prefetch for API domain to speed up first API call -->
  <link rel="dns-prefetch" href="https://api.brpublications.com" />
  <link rel="preconnect" href="https://api.brpublications.com" crossorigin />
  <!-- Preconnect to Google Fonts — establishes connection early but does NOT block render -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <!-- Load Inter font asynchronously — does NOT block initial paint -->
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700;800&display=swap"
    media="print" onload="this.media='all'" />
  <noscript>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700;800&display=swap" />
  </noscript>

  <!-- Google Search Console ownership verification -->
  <meta name="google-site-verification" content="qOXvBk40cKzVi-OX8rO-RzYbcFkaItXCQeMzQ7SjgU4" />

  <!-- Citation.js for client-side bibliography generation -->
  <script src="https://cdn.jsdelivr.net/npm/citation-js/build/citation.min.js"></script>
</head>

<body>
  <div id="root"></div>
  <script type="module" src="/src/main.tsx"></script>
</body>

</html>
