name: Deploy React App
on:
  push:
    branches:
      - Release/ui_v1_14_04_2026
      
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: Release/ui_v1_14_04_2026  # ← ADD THIS LINE
    steps:
      - uses: actions/checkout@v3
      - name: Setup Node
        uses: actions/setup-node@v3
        with:
          node-version: 20
      - name: Install & Build
        run: |
          npm install
          npm run build
        env:
          VITE_API_BASE_URL: ${{ vars.VITE_API_BASE_URL }}
          VITE_API_URL: ${{ vars.VITE_API_URL }}
          VITE_CSP_POLICY: ${{ vars.VITE_CSP_POLICY }}
          VITE_GOOGLE_CLIENT_ID: ${{ vars.VITE_GOOGLE_CLIENT_ID }}
          REACT_APP_GOOGLE_CLIENT_ID: ${{ vars.REACT_APP_GOOGLE_CLIENT_ID }}
      - name: Deploy to Hostinger via FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.4
        with:
          server: ${{ secrets.HOSTINGER_HOST }}
          username: ${{ secrets.HOSTINGER_USERNAME }}
          password: ${{ secrets.HOSTINGER_PASSWORD }}
          protocol: ftps
          port: 21
          local-dir: ./dist/
          server-dir: /home/u349309030/domains/brpublications.com/public_html/
          dangerous-clean-slate: true
          exclude: |
            **/james/**
            **/James backup/**
