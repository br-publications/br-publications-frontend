name: IndexNow ping
on:
  schedule:
    - cron: '30 2 * * *'   # daily, 08:00 IST
  workflow_dispatch: {}     # also runnable from the Actions tab (button)
jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node scripts/indexnow.mjs --since=2
