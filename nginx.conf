server {
    listen 80;
    server_name localhost;

    root /usr/share/nginx/html;
    index index.html index.htm;

    # ── Trailing slash removal ────────────────────────────────────────────────
    # Redirect /about/ → /about (301 permanent) to prevent duplicate-URL 404s.
    # The root "/" is excluded so the homepage is never affected.
    rewrite ^/((?!$).+)/$ /$1 permanent;

    # ── SPA fallback ─────────────────────────────────────────────────────────
    # Serve index.html for any path that doesn't map to a real file,
    # so React Router handles all client-side routes correctly.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # ── Static asset caching ──────────────────────────────────────────────────
    # Hashed JS/CSS chunks can be cached indefinitely (content-addressed).
    location ~* \.(js|css)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Images / fonts / icons — long cache, but not immutable (may be replaced).
    location ~* \.(png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot|webp|avif)$ {
        expires 1y;
        add_header Cache-Control "public, no-transform";
    }

    # ── Error pages ───────────────────────────────────────────────────────────
    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
    }
}

